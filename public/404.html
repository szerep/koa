<!doctype html>
<!--
  Cloudflare Pages serves this page, with status 404, for any path that doesn't exist (Phase 9
  Step 10). Its presence also turns off Pages' single-page-app fallback, which used to answer
  unknown paths (including missing /assets/* files) with index.html and status 200.
  Self-contained on purpose: no scripts, fonts or images, and never precached (the service
  worker answers every navigation with index.html, so installed users never see this page).
  Colors mirror src/styles/tokens.css; keep them in sync if the tokens change.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f9eee1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page not found · Koa</title>
    <style>
      :root {
        --bg: #f9eee1; /* --cream-100 */
        --surface: #fffaf3; /* --cream-50 */
        --text-heading: #5c4334; /* --bark-700 */
        --text-muted: #6e5646; /* --bark-600 */
        --accent: #96a07e; /* --euca-500 */
        --accent-ink: #2f3524; /* --euca-900 */
        --focus-ring: #5f6a4b; /* --euca-700 */
        --shadow-2: 0 2px 4px rgb(92 67 52 / 0.06), 0 10px 24px -8px rgb(92 67 52 / 0.18);
        --shadow-accent: 0 10px 18px -6px rgb(79 90 57 / 0.45);
        color-scheme: light;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        background: var(--bg);
        color: var(--text-muted);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 1rem;
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
      }
      main {
        width: 100%;
        max-width: 360px;
        padding: 32px 24px;
        border-radius: 28px;
        background: var(--surface);
        box-shadow: var(--shadow-2);
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        color: var(--text-heading);
        font-family: ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
        font-size: 1.75rem;
        font-weight: 600;
        line-height: 1.2;
      }
      p {
        margin: 0 0 24px;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 28px;
        border-radius: 20px;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 700;
        text-decoration: none;
        box-shadow: var(--shadow-accent);
      }
      a:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>We couldn't find the page or file you were looking for. Koa is still waiting for you.</p>
      <a href="/">Go to Koa</a>
    </main>
  </body>
</html>
